name: "stop all workflows"
description: "Action stops all workflows in a PR to save compute resources. Disabled for Pezkuwi fork - requires Parity's internal GitHub App."
inputs:
  app-id:
    description: "App id (not used in fork)"
    required: false
  app-key:
    description: "App token (not used in fork)"
    required: false
runs:
  using: "composite"
  steps:
    - name: Workflow stopper - Skip (fork mode)
      shell: bash
      run: |
        echo "::notice::Workflow stopper is disabled in Pezkuwi fork (requires Parity's internal GitHub App)"
        echo "To enable, create your own GitHub App and configure WORKFLOW_STOPPER_RUNNER_APP_ID/APP_KEY secrets"
